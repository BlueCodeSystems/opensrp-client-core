import org.gradle.api.tasks.bundling.Zip

boolean isReleaseBuild() {
    !project.version.toString().contains('SNAPSHOT')
}

boolean isSkipSigning() {
    project.hasProperty('skipSigning') && project.property('skipSigning').toString().toBoolean()
}

String getRepositoryUsername() {
    project.hasProperty('sonatypeUsername') ? project.property('sonatypeUsername').toString() : ''
}

String getRepositoryPassword() {
    project.hasProperty('sonatypePassword') ? project.property('sonatypePassword').toString() : ''
}

def centralBundleEnabled = project.findProperty('centralBundle')?.toString()?.toBoolean() == true

publishing {
    publications {
        register('maven', MavenPublication) {
            afterEvaluate {
                from components.release
            }
            artifactId = project.findProperty('POM_SETTING_ARTIFACT_ID')?.toString() ?: project.name
            pom {
                name = project.findProperty('POM_SETTING_NAME')?.toString() ?: project.name
                packaging = project.findProperty('POM_SETTING_PACKAGING')?.toString() ?: 'aar'
                description = project.findProperty('POM_SETTING_DESCRIPTION')?.toString() ?: project.description
                url = project.findProperty('POM_SETTING_URL')?.toString() ?: ''
                scm {
                    url = project.findProperty('POM_SETTING_SCM_URL')?.toString() ?: ''
                    connection = project.findProperty('POM_SETTING_SCM_CONNECTION')?.toString() ?: ''
                    developerConnection = project.findProperty('POM_SETTING_SCM_DEV_CONNECTION')?.toString() ?: ''
                }
                licenses {
                    license {
                        name = project.findProperty('POM_SETTING_LICENCE_NAME')?.toString() ?: ''
                        url = project.findProperty('POM_SETTING_LICENCE_URL')?.toString() ?: ''
                        distribution = project.findProperty('POM_SETTING_LICENCE_DIST')?.toString() ?: ''
                    }
                }
                developers {
                    developer {
                        id = project.findProperty('POM_SETTING_DEVELOPER_ID')?.toString() ?: ''
                        name = project.findProperty('POM_SETTING_DEVELOPER_NAME')?.toString() ?: ''
                    }
                }
            }
        }
    }
    repositories {
        if (project.findProperty('centralBundle')?.toString()?.toBoolean() == true) {
            maven {
                name = 'CentralBundle'
                url = layout.buildDirectory.dir('central-bundle')
            }
        } else {
            maven {
                name = 'Sonatype'
                def releaseUrl = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                def snapshotUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
                url = uri(isReleaseBuild() ? releaseUrl : snapshotUrl)
                credentials {
                    username = getRepositoryUsername()
                    password = getRepositoryPassword()
                }
            }
        }
    }
}

signing {
    if (isSkipSigning()) {
        logger.lifecycle('Signing skipped (-PskipSigning=true)')
        required { false }
    } else {
        required {
            isReleaseBuild() && (gradle.taskGraph.hasTask('publish') || gradle.taskGraph.hasTask('publishToMavenLocal'))
        }
        if (project.hasProperty('useGpgCmd') && project.property('useGpgCmd').toString().toBoolean()) {
            useGpgCmd()
        }
        sign publishing.publications.named('maven').get()
    }
}

tasks.register('packageReleaseZip', Zip) {
    group = 'distribution'
    description = 'Packages the release artifacts (aar, POM, sources, javadoc) into a single zip archive.'
    dependsOn 'assembleRelease', 'sourcesJar', 'javadocJar', 'generatePomFileForMavenPublication'
    from("${buildDir}/outputs/aar") { include '*-release.aar' }
    from("${buildDir}/publications/maven") { include 'pom-default.xml'; into('maven') }
    from("${buildDir}/libs") { include '*-sources.jar', '*-javadoc.jar' }
    def artifactId = project.findProperty('POM_SETTING_ARTIFACT_ID') ?: project.name
    def versionName = project.version?.toString() ?: project.findProperty('VERSION_NAME') ?: 'unspecified'
    archiveBaseName.set(artifactId.toString())
    archiveVersion.set(versionName.toString())
    destinationDirectory.set(file("${buildDir}/releasePackage"))
}

tasks.register('generateCentralBundleChecksums') { task ->
    group = 'publishing'
    description = 'Generates SHA-256 and SHA-512 checksum files for Central bundle artifacts.'
    task.enabled = centralBundleEnabled
    if (centralBundleEnabled) {
        task.dependsOn('publishMavenPublicationToCentralBundleRepository')
    }
    doLast {
        def bundleDir = layout.buildDirectory.dir('central-bundle').get().asFile
        if (!bundleDir.exists()) {
            logger.lifecycle('Central bundle directory not found: {}', bundleDir)
            return
        }
        bundleDir.eachFileRecurse { file ->
            if (file.isFile()) {
                ['SHA-256': 'sha256', 'SHA-512': 'sha512'].each { alg, ext ->
                    def digest = java.security.MessageDigest.getInstance(alg)
                    file.withInputStream { is ->
                        byte[] buffer = new byte[8192]
                        int read
                        while ((read = is.read(buffer)) != -1) {
                            digest.update(buffer, 0, read)
                        }
                    }
                    def checksum = digest.digest().collect { String.format('%02x', it) }.join()
                    new File(file.parentFile, "${file.name}.${ext}").text = checksum
                }
            }
        }
        logger.lifecycle('Checksums generated for Central bundle artifacts.')
    }
}

tasks.register('zipCentralBundle', Zip) { task ->
    group = 'publishing'
    description = 'Zips the Central bundle directory for manual upload to Sonatype Central.'
    task.enabled = centralBundleEnabled
    dependsOn 'generateCentralBundleChecksums'
    def artifactId = project.findProperty('POM_SETTING_ARTIFACT_ID') ?: project.name
    def versionName = project.version?.toString() ?: project.findProperty('VERSION_NAME') ?: 'unspecified'
    archiveFileName.set("central-bundle-${artifactId}-${versionName}.zip")
    from(layout.buildDirectory.dir('central-bundle'))
    destinationDirectory.set(file("${buildDir}/distributions"))
}
