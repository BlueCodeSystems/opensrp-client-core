plugins {
    id 'com.android.application'
}

android {
    namespace 'org.smartregister.sample'
    compileSdk rootProject.ext.androidCompileSdk
    buildToolsVersion rootProject.ext.androidBuildToolsVersion

    defaultConfig {
        applicationId 'org.smartregister.sample'
        minSdk rootProject.ext.androidMinSdk
        targetSdk rootProject.ext.androidTargetSdk
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/*', 'LICENSE.txt', 'META-INF/DEPENDENCIES*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'OAUTH_CLIENT_ID', '"opensrp-trusted-client"'
            buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '"O@aTHS#cr3t"'
            minifyEnabled false
        }
        release {
            buildConfigField 'String', 'OAUTH_CLIENT_ID', '"opensrp-trusted-client"'
            buildConfigField 'String', 'OAUTH_CLIENT_SECRET', '"O@aTHS#cr3t"'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.configureEach {
    exclude group: 'net.zetetic', module: 'sqlcipher-android'
}

dependencies {
    implementation(project(':opensrp-core')) {
        transitive = true
        exclude group: 'com.ibm.fhir', module: 'fhir-model'
    }

    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation fileTree(dir: "$buildDir/libs", include: ['*.jar'])

    implementation 'com.ibm.fhir:fhir-model:4.7.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
